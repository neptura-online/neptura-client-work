<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/assets/fevicon.webp" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="preload"
      href="/fonts/merriweather/Merriweather-Regular.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/figtree/Figtree.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      as="image"
      href="/assets/pattern-bg.webp"
      fetchpriority="high"
    />
    <noscript>
      <img
        src="/assets/pattern-bg.webp"
        alt=""
        style="
          position: absolute;
          inset: 0;
          width: 100%;
          height: 100%;
          object-fit: cover;
        "
      />
    </noscript>

    <title>e-Marketing</title>
    <style>
      body {
        margin: 0;
        font-family: "Figtree", sans-serif;
      }
      h1 {
        font-family: "Merriweather", serif;
        font-weight: 800;
        opacity: 1;
        transform: none;
      }
    </style>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
